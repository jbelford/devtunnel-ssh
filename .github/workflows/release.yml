name: 🚀 release (prepare)

# Manually-triggered: computes the next version, bumps Dtssh.csproj,
# regenerates CHANGELOG.md, and opens a release PR for review. Approve the
# PR's workflow runs and merge it manually to trigger release-publish.yml.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How to pick the next version (ignored if 'version' is set)."
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Explicit version to release, e.g. 1.4.0 (overrides 'bump')."
        type: string
        required: false
        default: ""
      prerelease:
        description: "Mark the eventual GitHub release as a pre-release."
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    name: 📝 Prepare release PR
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧰 Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: 🔢 Compute next version
        id: bump
        run: |
          set -euo pipefail
          cur=$(grep -oP '<Version>\K[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' Dtssh.csproj)
          echo "current version: $cur"
          req="${{ inputs.version }}"
          if [ -n "$req" ]; then
            new="${req#v}"
          elif [ "${{ inputs.bump }}" = "auto" ]; then
            new="$(git cliff --config .config/cliff.toml --bumped-version 2>/dev/null | sed 's/^v//')"
            if [ -z "$new" ]; then
              echo "::error::git-cliff could not compute a bumped version"; exit 1
            fi
          else
            IFS=. read -r MA MI PA <<< "$cur"
            case "${{ inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            new="$MA.$MI.$PA"
          fi
          if ! echo "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid version '$new' (expected MAJOR.MINOR.PATCH)"; exit 1
          fi
          tag="v$new"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cur=$cur" >> "$GITHUB_ENV"
          echo "new=$new" >> "$GITHUB_ENV"

      - name: 📄 Apply version bump and regenerate changelog
        run: |
          set -euo pipefail
          sed -i "s#<Version>$cur</Version>#<Version>$new</Version>#" Dtssh.csproj
          grep -q "<Version>$new</Version>" Dtssh.csproj
          git cliff --config .config/cliff.toml --tag "v$new" -o CHANGELOG.md
          git cliff --config .config/cliff.toml --tag "v$new" --latest --strip all -o RELEASE_NOTES.md

      - name: 🔀 Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          branch="release/$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): $TAG"
          git push origin "$branch"

          gh label create release --color 0e8a16 --description "Release PR" --force
          gh label create prerelease --color fbca04 --description "Pre-release" --force

          labels="release"
          if [ "${{ inputs.prerelease }}" = "true" ]; then labels="release,prerelease"; fi

          {
            echo "Automated release for **$TAG**."
            echo
            echo "Review the changelog and approve any pending workflow runs."
            echo "Merging this PR tags \`$TAG\` and publishes the GitHub Release"
            echo "after the main-branch build succeeds."
            echo
            echo "---"
            echo
            cat RELEASE_NOTES.md
          } > pr-body.md

          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "chore(release): $TAG" \
            --body-file pr-body.md \
            --label "$labels"
